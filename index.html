<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<title>Oson Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Izometrik kampus xaritasi to'liq ekranda; ustida shisha boshqaruv kartalari. Yorug' — kunduzgi kampus, qorong'i — kechki kampus. */
:root{
  --bg:#edf1f7; --ink:#16213a; --muted:#66738e; --faint:#94a0b7; --line:rgba(22,33,58,.08);
  --card:rgba(255,255,255,.86); --card-solid:#ffffff; --card-edge:rgba(255,255,255,.75); --chip:#eff3f9;
  --blue:#2f6bde; --blue-soft:#e5edfc; --on-blue:#ffffff;
  --green:#1b9a56; --green-soft:#e0f4e8; --amber:#c98205; --amber-soft:#fcf0d6; --red:#d6424a; --red-soft:#fce6e7;
  --ice:#dcecff; --ice-ink:#2f6fb8; --note:#fff5c9; --note-ink:#584812;
  --shadow:0 10px 30px rgba(22,44,94,.10),0 1px 2px rgba(22,44,94,.06);
  --tun:0;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(14px + env(safe-area-inset-top,0px)); --gb:calc(14px + env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121827; --ink:#e6ebf5; --muted:#9aa5be; --faint:#6c7790; --line:rgba(255,255,255,.08);
  --card:rgba(25,32,48,.86); --card-solid:#1b2234; --card-edge:rgba(255,255,255,.06); --chip:#252e44;
  --blue:#5b8ff0; --blue-soft:#20335c; --on-blue:#ffffff;
  --green:#4cc782; --green-soft:#173a29; --amber:#f0b03c; --amber-soft:#3b2f17; --red:#f06b72; --red-soft:#45222a;
  --ice:#1f3350; --ice-ink:#8ec0ff; --note:#3a3420; --note-ink:#efe2a6;
  --shadow:0 10px 30px rgba(0,0,0,.35); --tun:1; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121827; --ink:#e6ebf5; --muted:#9aa5be; --faint:#6c7790; --line:rgba(255,255,255,.08);
  --card:rgba(25,32,48,.86); --card-solid:#1b2234; --card-edge:rgba(255,255,255,.06); --chip:#252e44;
  --blue:#5b8ff0; --blue-soft:#20335c; --on-blue:#ffffff;
  --green:#4cc782; --green-soft:#173a29; --amber:#f0b03c; --amber-soft:#3b2f17; --red:#f06b72; --red-soft:#45222a;
  --ice:#1f3350; --ice-ink:#8ec0ff; --note:#3a3420; --note-ink:#efe2a6;
  --shadow:0 10px 30px rgba(0,0,0,.35); --tun:1; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#scene{position:fixed;inset:0}
#scene canvas{display:block}
.labels{position:absolute;inset:0;cursor:grab}
.labels.hov{cursor:pointer}
.labels:active{cursor:grabbing}
.glass{background:var(--card);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--card-edge);border-radius:16px;box-shadow:var(--shadow)}

/* yuqori panel */
.top{position:fixed;top:var(--gt);left:var(--gl);right:var(--gr);display:flex;gap:10px;align-items:center;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:var(--on-blue);font:700 16px var(--f-display);flex:none}
.brand b{display:block;font:600 14px var(--f-display);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.search{position:relative;flex:1;min-width:0;max-width:560px;display:flex;align-items:center;gap:8px;padding:0 12px;height:50px}
.search svg{flex:none;color:var(--faint)}
.search input{flex:1;min-width:0;width:100%;border:0;background:none;outline:none;font:inherit;color:var(--ink);height:100%}
.search input::placeholder{color:var(--faint)}
kbd{font:600 11px var(--f-body);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
#results{position:absolute;left:0;right:0;top:56px;padding:6px;max-height:60vh;overflow:auto}
.res{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.res:hover,.res.act{background:var(--blue-soft)}
.res .ic{width:30px;height:30px;border-radius:8px;background:var(--chip);display:grid;place-items:center;flex:none}
.res b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{color:var(--muted)}
.res>div{min-width:0}
.sp{flex:1}
.live{display:flex;align-items:center;gap:8px;padding:0 14px;height:50px;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.payt{color:var(--ink);padding-right:10px;margin-right:2px;border-right:1px solid var(--line);white-space:nowrap}
.tools button.on{color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.team{display:flex;align-items:center;gap:4px;padding:0 10px;height:50px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;position:relative;border:2px solid var(--card-solid);cursor:pointer;flex:none}
.av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--card-solid);background:var(--faint)}
.av i.on{background:var(--green)}

/* KPI */
.kpis{position:fixed;top:calc(var(--gt) + 64px);left:var(--gl);display:flex;gap:10px;z-index:4;max-width:calc(100vw - 32px)}
.kpi{padding:11px 14px;display:flex;gap:11px;align-items:flex-start;min-width:170px;cursor:pointer;text-align:left}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--blue-soft)}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.kpi b{font:600 21px var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b em{font:600 12.5px var(--f-body);color:var(--muted);font-style:normal}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.kpi .up{color:var(--green);font-weight:800}
.bar{height:5px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:5px}

/* asboblar */
.tools{position:fixed;right:var(--gr);top:calc(var(--gt) + 64px);display:flex;flex-direction:column;padding:5px;gap:2px;z-index:5;transition:right .35s}
.tools button{position:relative;width:36px;height:36px;border:0;background:none;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.tools button[data-tip]:hover::after,.tools button[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--ink);color:var(--bg);font:700 12px var(--f-body);padding:6px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow);z-index:2}
.tools button:hover{background:var(--chip);color:var(--ink)}
.tools hr{border:0;border-top:1px solid var(--line);margin:3px 6px}
body.ochiq .tools{right:calc(var(--gr) + 386px)}

/* o'ng panel */
.panel{position:fixed;right:var(--gr);top:calc(var(--gt) + 64px);bottom:var(--gb);width:372px;z-index:6;overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:0 0 16px}
body.ochiq .panel{transform:none}
.ph{position:sticky;top:0;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:16px 16px 12px;z-index:2;border-bottom:1px solid var(--line)}
.ph .row{display:flex;gap:12px;align-items:center}
.ph .row>div{min-width:0}
.ph .big{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;font-size:22px;flex:none}
.ph h2{margin:0;font:600 16px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.x{margin-left:auto;align-self:flex-start;border:0;background:var(--chip);width:30px;height:30px;border-radius:9px;cursor:pointer;color:var(--muted);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--muted)}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.b{background:var(--blue-soft);color:var(--blue)}
.chip.a{background:var(--amber-soft);color:var(--amber)}
.chip.r{background:var(--red-soft);color:var(--red)}
.chip.i{background:var(--ice);color:var(--ice-ink)}
.sec{padding:14px 16px 0}
.sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:800;display:flex;justify-content:space-between}
.sec p.t{margin:0;color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--chip);border-radius:12px;padding:9px 11px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11.5px}
.stat b{font-size:15px}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;text-decoration:none;cursor:pointer}
.item:hover{background:var(--chip)}
.item.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:var(--blue-soft)}100%{background:transparent}}
.item .ic{width:32px;height:32px;border-radius:9px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:15px}
.item:hover .ic{background:var(--card-solid)}
.item div{min-width:0;flex:1}
.item b{display:block;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font-size:11.5px}
.item .go{color:var(--faint);font-size:16px}
.item.off{cursor:default}
.item.off:hover{background:none}
.vid{border-radius:14px;overflow:hidden;background:#0d1424;aspect-ratio:1;position:relative;max-width:100%}
.vid.r916{aspect-ratio:9/16;max-height:520px;margin:0 auto}
.vid video,.vid img{width:100%;height:100%;object-fit:contain;display:block}
.vid .yoq{display:grid;place-items:center;height:100%;color:#8fa0bf;font-size:12.5px;padding:20px;text-align:center}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px;margin-top:8px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card-solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.steps{display:flex;flex-direction:column;gap:2px}
.st{display:flex;gap:10px;align-items:center;font-size:13px;padding:4px 0;color:var(--muted)}
.st i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;flex:none;background:var(--chip);color:var(--faint)}
.st.d i{background:var(--blue);color:var(--on-blue)}
.st.d{color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:10px;background:var(--chip);text-decoration:none;cursor:pointer;border:0;color:var(--ink)}
.btn:hover{background:var(--blue-soft);color:var(--blue)}
.btn.p{background:var(--blue);color:var(--on-blue)}
.vcard{display:flex;gap:10px;align-items:center;padding:7px;border-radius:12px;cursor:pointer}
.vcard:hover{background:var(--chip)}
.vcard img,.vcard .ph0{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--chip);flex:none;display:grid;place-items:center}
.vcard>div{min-width:0}
.vcard b{display:block;font-size:13px;font-weight:700}
.vcard small{color:var(--muted);font-size:11.5px}
.mod{margin-bottom:9px}
.mod .t{display:flex;justify-content:space-between;font-size:13px}
.mod .t span{color:var(--muted);font-variant-numeric:tabular-nums}
.ritm{display:flex;align-items:flex-end;gap:2px;height:84px;padding-top:6px}
.ritm b{display:block;flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}
.ritm b.eng{background:var(--amber)}
.ritm-o{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:3px}
.kcard{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:12px}
.kcard:hover{background:var(--chip)}
.kcard>div:last-child{min-width:0}
.kcard b{display:block;font-size:13.5px}
.kcard small{color:var(--muted);font-size:12px}
.item .chip{flex:none}
.note{background:var(--note);color:var(--note-ink);border-radius:4px 12px 12px 12px;padding:9px 11px;margin-bottom:7px;font-size:12.5px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.note b{display:block;font-size:13px;margin-bottom:2px}
.cd{display:flex;gap:8px}
.cd>div{flex:1;background:var(--chip);border-radius:12px;padding:9px 8px;text-align:center;min-width:0}
.cd b{display:block;font:600 19px var(--f-display);font-variant-numeric:tabular-nums}
.cd small{font-size:11px;color:var(--muted)}
code{font:12px ui-monospace,Consolas,monospace;background:var(--chip);padding:2px 6px;border-radius:6px}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:700;padding:6px 0}

/* pastki kartalar */
.card{position:fixed;z-index:4;padding:12px 14px}
.pipe{left:var(--gl);bottom:var(--gb);width:min(640px,calc(100vw - 400px));display:flex;gap:14px;align-items:center}
.pipe .lft{flex:1;min-width:0}
.pipe .ttl{font-size:12px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:8px;min-width:0}
.pipe .ttl b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe .ttl .btn{padding:3px 9px}
.track{display:flex;align-items:flex-start}
.node{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:11px;color:var(--muted);text-align:center;min-width:0}
.node:not(:last-child)::after{content:"";position:absolute;top:13px;left:calc(50% + 15px);right:calc(-50% + 15px);height:3px;border-radius:3px;background:var(--chip)}
.node.d:not(:last-child)::after{background:var(--blue)}
.node i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-style:normal;font-size:13px;margin-bottom:4px;color:var(--faint)}
.node.d i{background:var(--blue);color:var(--on-blue)}
.node.c i{box-shadow:0 0 0 4px var(--blue-soft)}
.node span{max-width:100%;font-size:10.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ship{display:flex;gap:10px;align-items:center;padding-left:14px;border-left:1px solid var(--line);cursor:pointer;min-width:0}
.ship img,.ship .ph0{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--chip);flex:none}
.ship b{display:block;font-size:13.5px}
.ship small{display:block;color:var(--muted);font-size:11.5px}
.feed{right:var(--gr);bottom:var(--gb);width:340px;max-height:min(330px,calc(100vh - var(--gt) - var(--gb) - 64px - 360px));display:flex;flex-direction:column;padding:10px 6px 6px;transition:opacity .25s}
.feed.yigil{max-height:none}
.feed.yigil .fl{display:none}
.feed.yigil .tabs{border-bottom:0;padding-bottom:4px}
.tabs .yig{border:0;background:var(--chip);width:26px;height:26px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12px;align-self:center;padding:0}
.tabs .yig:hover{color:var(--ink)}
body.ochiq .feed{opacity:0;pointer-events:none}
.tabs{display:flex;gap:4px;padding:0 8px 8px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--chip);color:var(--ink)}
.tabs .n{margin-left:auto;align-self:center;font-size:11.5px;color:var(--faint);padding-right:4px}
.fl{overflow:auto;padding:4px 2px}
.ev{display:flex;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;align-items:flex-start}
.ev:hover{background:var(--chip)}
.ev .av{width:26px;height:26px;font-size:11px;border:0;margin-top:1px}
.ev>div{min-width:0}
.ev p{margin:0;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev small{color:var(--faint);font-size:11px}

/* 3D ichidagi yorliqlar */
.lbl{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;background:var(--card-solid);border-radius:22px;padding:5px 11px 5px 6px;box-shadow:0 6px 18px rgba(22,44,94,.16);font-weight:700;font-size:12.5px;white-space:nowrap;transition:transform .2s;color:var(--ink)}
.lbl:hover,.lbl.sel{transform:translateY(-3px)}
.lbl.sel{outline:2px solid var(--blue)}
.lbl .e{width:24px;height:24px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;font-size:13px}
.lbl .n{background:var(--blue);color:var(--on-blue);border-radius:10px;font-size:11px;padding:1px 7px}
.lbl .n.a{background:var(--amber);color:var(--on-blue)}
.lbl .new{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.pin{position:relative;display:flex;flex-direction:column;align-items:center}
.pin .drop{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--blue);display:grid;place-items:center;margin-top:6px;box-shadow:0 4px 10px rgba(47,107,222,.4);animation:bob 2.4s ease-in-out infinite}
.pin .drop::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--card-solid)}
@keyframes bob{50%{translate:0 -4px}}
.tl{pointer-events:auto;cursor:pointer;background:var(--card-solid);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;box-shadow:0 4px 12px rgba(22,44,94,.15);white-space:nowrap;display:flex;gap:6px;align-items:center;color:var(--ink)}
.tl em{font-style:normal;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--green-soft);color:var(--green)}
.tl em.a{background:var(--amber-soft);color:var(--amber)}
.tl em.o{background:var(--chip);color:var(--muted)}
.tl.sel{outline:2px solid var(--blue)}
.who{pointer-events:auto;cursor:pointer;background:var(--card-solid);border-radius:12px 12px 12px 3px;padding:6px 10px;font-size:11.5px;box-shadow:0 6px 16px rgba(22,44,94,.16);max-width:210px;color:var(--ink);transform:translate(50%,-10px)}
.who b{font-size:12px}
.who span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.who small{color:var(--faint)}
.uzoq .tl:not(.sel){display:none}
.uzoq .xona-pin:not(.tanl){display:none}
.labels:not(.yaqin2):not(.st-tanl) .tl[data-v]:not(.sel){display:none}
.yaqin:not(.yopiq) .office-pin:not(.tanl){display:none}
.yopiq .xona-pin{display:none}
.xona-pin .lbl{font-size:12px;padding:4px 10px 4px 5px}
.xona-pin .lbl .e{width:22px;height:22px;font-size:12px}
.oqim{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:3px 10px 3px 7px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:0 4px 12px rgba(22,44,94,.12)}
.oqim i{width:8px;height:8px;border-radius:50%;flex:none}
.yaqin .oqim,.oqimsiz .oqim{display:none}

<script type="module">
const S = JSON.parse(document.getElementById('shifr').textContent);
const KALIT = 'oson-office-kalit';
const enc = new TextEncoder();
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const s64 = (u) => btoa(String.fromCharCode(...u));
const sub = crypto.subtle;

async function loginId(login) {
  return s64(new Uint8Array(await sub.digest('SHA-256', enc.encode('oson-office:' + login.trim().toLowerCase()))));
}
async function kalitOl(login, parol) {
  const id = await loginId(login);
  const u = S.users.find((x) => x.id === id) || { ...S.users[0], id: null };
  const base = await sub.importKey('raw', enc.encode(parol), 'PBKDF2', false, ['deriveKey']);
  const kek = await sub.deriveKey({ name: 'PBKDF2', salt: b64(u.salt), iterations: S.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  if (!u.id) throw new Error('login');
  return new Uint8Array(await sub.decrypt({ name: 'AES-GCM', iv: b64(u.iv) }, kek, b64(u.key)));
}
async function och(raw) {
  const k = await sub.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await sub.decrypt({ name: 'AES-GCM', iv: b64(S.iv) }, k, b64(S.data))));
}
async function boshla(p) {
  // hujjatlar shifr ichida keladi — ochilganda brauzerning o'zida sahifa bo'lib ochiladi
  for (const z of p.data.zonalar) for (const n of z.narsalar) {
    if (n.url?.startsWith('hujjat:')) n.url = URL.createObjectURL(new Blob([p.hujjatlar[n.url.slice(7)]], { type: 'text/html' }));
  }
  window.OFFICE_DATA = p.data;
  window.OFFICE_CHIQISH = async () => {
    try { localStorage.removeItem(KALIT); sessionStorage.setItem('oson-office-chiqdi', '1'); } catch {}
    try { await navigator.credentials?.preventSilentAccess?.(); } catch {}
    location.reload();
  };
  document.getElementById('kirish').hidden = true;
  // sahna kodi ham shifr ichida keladi; 'three' importlari sahifadagi importmap orqali topiladi
  await import(URL.createObjectURL(new Blob([p.app], { type: 'text/javascript' })));
}

// Chrome/Edge parol menejeri: kirgandan keyin "Parolni saqlaysizmi?" deb so'raydi, keyingi safar o'zi to'ldiradi.
// Forma JS bilan yuborilgani uchun (sahifa qayta yuklanmaydi) Chrome buni o'zi sezmaydi — shuning uchun aniq aytamiz.
const PK = 'PasswordCredential' in window && navigator.credentials;
async function parolSaqla(login, parol) {
  if (!PK) return;
  try { await navigator.credentials.store(new PasswordCredential({ id: login.trim().toLowerCase(), password: parol, name: 'Oson Office' })); } catch {}
}
async function parolBilanKir(login, parol, esla) {
  const raw = await kalitOl(login, parol);
  const p = await och(raw);
  if (esla) { try { localStorage.setItem(KALIT, s64(raw)); } catch {} }
  return p;
}

let saqlangan = null, kirdi = false;
try { saqlangan = localStorage.getItem(KALIT); } catch {}
if (saqlangan) {
  try { await boshla(await och(b64(saqlangan))); kirdi = true; }
  catch { try { localStorage.removeItem(KALIT); } catch {} }
}
// Brauzerda saqlangan parol bo'lsa — so'ramasdan kiradi (Chrome bir marta hisobni tanlatishi mumkin)
let chiqdi = false;
try { chiqdi = !!sessionStorage.getItem('oson-office-chiqdi'); } catch {}
if (!kirdi && PK && !chiqdi) {
  try {
    const c = await navigator.credentials.get({ password: true, mediation: 'optional' });
    if (c?.password) { await boshla(await parolBilanKir(c.id, c.password, true)); kirdi = true; }
  } catch {}
}
if (!kirdi) document.getElementById('yuk').classList.add('off');

document.getElementById('k-forma').addEventListener('submit', async (e) => {
  e.preventDefault();
  const tugma = document.getElementById('k-tugma'), xato = document.getElementById('k-xato');
  tugma.disabled = true; tugma.textContent = 'Tekshirilmoqda…'; xato.textContent = '';
  try {
    const login = document.getElementById('k-login').value, parol = document.getElementById('k-parol').value;
    const p = await parolBilanKir(login, parol, document.getElementById('k-esla').checked);
    await parolSaqla(login, parol);
    await boshla(p);
  } catch {
    xato.textContent = "Login yoki parol noto'g'ri. Qaytadan kiriting.";
    tugma.disabled = false; tugma.textContent = 'Kirish';
    document.getElementById('k-parol').select();
  }
});
</script>
