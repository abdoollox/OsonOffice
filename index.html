<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Oson Office</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f6bde'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
<meta name="theme-color" content="#edf1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121827" media="(prefers-color-scheme: dark)">
<meta name="description" content="Oson Akademiya — O'quv bo'limi ishlarining virtual ofisi">
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Izometrik kampus xaritasi to'liq ekranda; ustida shisha boshqaruv kartalari. Yorug' — kunduzgi kampus, qorong'i — kechki kampus. */
:root{
  --bg:#edf1f7; --ink:#16213a; --muted:#66738e; --faint:#94a0b7; --line:rgba(22,33,58,.08);
  --card:rgba(255,255,255,.86); --card-solid:#ffffff; --card-edge:rgba(255,255,255,.75); --chip:#eff3f9;
  --blue:#2f6bde; --blue-soft:#e5edfc; --on-blue:#ffffff;
  --green:#1b9a56; --green-soft:#e0f4e8; --amber:#c98205; --amber-soft:#fcf0d6; --red:#d6424a; --red-soft:#fce6e7;
  --ice:#dcecff; --ice-ink:#2f6fb8; --note:#fff5c9; --note-ink:#584812;
  --shadow:0 10px 30px rgba(22,44,94,.10),0 1px 2px rgba(22,44,94,.06);
  --tun:0;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(14px + env(safe-area-inset-top,0px)); --gb:calc(14px + env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121827; --ink:#e6ebf5; --muted:#9aa5be; --faint:#6c7790; --line:rgba(255,255,255,.08);
  --card:rgba(25,32,48,.86); --card-solid:#1b2234; --card-edge:rgba(255,255,255,.06); --chip:#252e44;
  --blue:#5b8ff0; --blue-soft:#20335c; --on-blue:#ffffff;
  --green:#4cc782; --green-soft:#173a29; --amber:#f0b03c; --amber-soft:#3b2f17; --red:#f06b72; --red-soft:#45222a;
  --ice:#1f3350; --ice-ink:#8ec0ff; --note:#3a3420; --note-ink:#efe2a6;
  --shadow:0 10px 30px rgba(0,0,0,.35); --tun:1; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121827; --ink:#e6ebf5; --muted:#9aa5be; --faint:#6c7790; --line:rgba(255,255,255,.08);
  --card:rgba(25,32,48,.86); --card-solid:#1b2234; --card-edge:rgba(255,255,255,.06); --chip:#252e44;
  --blue:#5b8ff0; --blue-soft:#20335c; --on-blue:#ffffff;
  --green:#4cc782; --green-soft:#173a29; --amber:#f0b03c; --amber-soft:#3b2f17; --red:#f06b72; --red-soft:#45222a;
  --ice:#1f3350; --ice-ink:#8ec0ff; --note:#3a3420; --note-ink:#efe2a6;
  --shadow:0 10px 30px rgba(0,0,0,.35); --tun:1; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#scene{position:fixed;inset:0}
#scene canvas{display:block}
.labels{position:absolute;inset:0;cursor:grab}
/* tanlanganda atrof xiralashadi */
#soya{position:absolute;inset:0;pointer-events:none;background:rgba(12,20,38,.42);backdrop-filter:blur(2.5px) saturate(.6);-webkit-backdrop-filter:blur(2.5px) saturate(.6);opacity:0;transition:opacity .45s}
#soya.on{opacity:1}
.labels.tanlov .pin:not(.tanl),.labels.tanlov .oqim,.labels.tanlov .who,.labels.tanlov .tl[data-z]:not(.tanl){opacity:.28;transition:opacity .3s}
.labels .pin,.labels .oqim,.labels .who{transition:opacity .3s}
/* Office ochilganda — xona nomlari ko'rinadi; Office'ning o'zi tanlanganda bino yorlig'i o'rniga xonalar */
/* ierarxiya: Akademiya -> 6 bo'lim; Product -> 8 xona */
.labels .pin.mxona{display:none}
.labels.ofis-ochiq .pin.bolim{display:flex}
.labels.mahsulot-ochiq .pin.mxona{display:flex}
.labels.mahsulot-ochiq .pin.bolim-mahsulot{display:none}
.labels.tanlov.ofis-tanl .pin.bolim,.labels.tanlov.mahsulot-tanl .pin.mxona{opacity:1}
.labels.ofis-tanl .pin.office-pin{display:none}
/* tanlangan xonaning o'z nomi ko'rinmaydi — nomi panelda */
.labels.tanlov .pin.xona-pin.tanl{display:none!important}
.labels.hov{cursor:pointer}
.labels:active{cursor:grabbing}
.glass{background:var(--card);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--card-edge);border-radius:16px;box-shadow:var(--shadow)}

/* yuqori panel */
.top{position:fixed;top:var(--gt);left:var(--gl);right:var(--gr);display:flex;gap:10px;align-items:center;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:var(--on-blue);font:700 16px var(--f-display);flex:none}
.brand b{display:block;font:600 14px var(--f-display);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.search{position:relative;flex:1;min-width:0;max-width:560px;display:flex;align-items:center;gap:8px;padding:0 12px;height:50px}
.search svg{flex:none;color:var(--faint)}
.search input{flex:1;min-width:0;width:100%;border:0;background:none;outline:none;font:inherit;color:var(--ink);height:100%}
.search input::placeholder{color:var(--faint)}
kbd{font:600 11px var(--f-body);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
#results{position:absolute;left:0;right:0;top:56px;padding:6px;max-height:60vh;overflow:auto}
.res{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.res:hover,.res.act{background:var(--blue-soft)}
.res .ic{width:30px;height:30px;border-radius:8px;background:var(--chip);display:grid;place-items:center;flex:none}
.res b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{color:var(--muted)}
.res>div{min-width:0}
.sp{flex:1}
.live{display:flex;align-items:center;gap:8px;padding:0 14px;height:50px;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.payt{color:var(--ink);padding-right:10px;margin-right:2px;border-right:1px solid var(--line);white-space:nowrap}
.tools button.on{color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.team{display:flex;align-items:center;gap:4px;padding:0 10px;height:50px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;position:relative;border:2px solid var(--card-solid);cursor:pointer;flex:none}
.av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--card-solid);background:var(--faint)}
.av i.on{background:var(--green)}

/* KPI */
.kpis{position:fixed;top:calc(var(--gt) + 64px);left:var(--gl);display:flex;gap:10px;z-index:4;max-width:calc(100vw - 32px)}
.kpi{padding:11px 14px;display:flex;gap:11px;align-items:flex-start;min-width:170px;cursor:pointer;text-align:left}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--blue-soft)}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.kpi b{font:600 21px var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b em{font:600 12.5px var(--f-body);color:var(--muted);font-style:normal}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.kpi .up{color:var(--green);font-weight:800}
.bar{height:5px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:5px}

/* asboblar */
.tools{position:fixed;right:var(--gr);top:calc(var(--gt) + 64px);display:flex;flex-direction:column;padding:5px;gap:2px;z-index:5;transition:right .35s}
.tools button{position:relative;width:36px;height:36px;border:0;background:none;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.tools button[data-tip]:hover::after,.tools button[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--ink);color:var(--bg);font:700 12px var(--f-body);padding:6px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow);z-index:2}
.tools button:hover{background:var(--chip);color:var(--ink)}
.tools hr{border:0;border-top:1px solid var(--line);margin:3px 6px}
body.ochiq:not(.p-markaz):not(.p-toliq) .tools{right:calc(var(--gr) + 386px)}

/* o'ng panel */
.panel{position:fixed;right:var(--gr);top:calc(var(--gt) + 64px);bottom:var(--gb);width:372px;z-index:6;overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:0 0 16px}
body.ochiq .panel{transform:none}
/* panelning o'ng tomondagi scroll chizig'i ko'rinmaydi (g'ildirak/barmoq bilan aylantirish ishlayveradi) */
.panel{scrollbar-width:none;-ms-overflow-style:none}
.panel::-webkit-scrollbar{display:none}
/* panel ko'rinishlari (Notion kabi) */
.ptop{display:flex;align-items:center;gap:10px}
.ptop .pt{min-width:0;flex:1}
/* tor yon panelda nomga joy qolsin: belgi yashiriladi, tugmalar ixchamroq */
body:not(.p-markaz):not(.p-toliq) .ptop .big{display:none}
body:not(.p-markaz):not(.p-toliq) .prejim button{width:26px}
.prejim{display:inline-flex;gap:2px;background:var(--chip);border-radius:10px;padding:3px;flex:none;align-self:center}
.prejim button{width:30px;height:28px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.prejim button:hover{color:var(--ink)}
.prejim button.on{background:var(--card-solid);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pfon{position:fixed;inset:0;z-index:6;background:rgba(12,20,38,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
body.ochiq.p-markaz .pfon{opacity:1;pointer-events:auto}
body.p-markaz .panel,body.p-toliq .panel{background:var(--card-solid);backdrop-filter:none;-webkit-backdrop-filter:none;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
body.ochiq.p-markaz .panel,body.ochiq.p-toliq .panel{opacity:1;pointer-events:auto}
body.p-markaz .panel{left:50%;right:auto;top:5vh;bottom:5vh;width:min(900px,calc(100vw - 48px));z-index:7;transform:translate(-50%,24px) scale(.98)}
body.ochiq.p-markaz .panel{transform:translate(-50%,0)}
body.p-toliq .panel{inset:0;width:auto;border-radius:0;border:0;z-index:9;transform:translateY(16px)}
body.ochiq.p-toliq .panel{transform:none}
body.p-markaz .panel>*,body.p-toliq .panel>*{zoom:1.1}
body.p-markaz .ph,body.p-markaz .sec{padding-inline:28px}
body.p-toliq .ph,body.p-toliq .sec{padding-inline:max(24px,calc((100% - 920px) / 2))}
body.p-markaz .ph h2,body.p-toliq .ph h2{font-size:21px}
.ph{position:sticky;top:0;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:16px 16px 12px;z-index:2;border-bottom:1px solid var(--line)}
.ph{padding:14px 16px}
.orqa{width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;background:var(--chip);color:var(--ink);border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
.orqa:hover{background:var(--blue-soft);color:var(--blue)}
.ph .big{width:40px;height:40px;border-radius:11px;background:var(--blue-soft);display:grid;place-items:center;font-size:22px;flex:none}
.ph h2{margin:0;font:600 16px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.x{margin-left:auto;align-self:flex-start;border:0;background:var(--chip);width:30px;height:30px;border-radius:9px;cursor:pointer;color:var(--muted);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--muted)}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.b{background:var(--blue-soft);color:var(--blue)}
.chip.a{background:var(--amber-soft);color:var(--amber)}
.chip.r{background:var(--red-soft);color:var(--red)}
.chip.i{background:var(--ice);color:var(--ice-ink)}
.sec{padding:14px 16px 0}
.sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:800;display:flex;justify-content:space-between}
.sec p.t{margin:0;color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--chip);border-radius:12px;padding:9px 11px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11.5px}
.stat b{font-size:15px}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;text-decoration:none;cursor:pointer}
.item:hover{background:var(--chip)}
.item.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:var(--blue-soft)}100%{background:transparent}}
.item .ic{width:32px;height:32px;border-radius:9px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:15px}
.item:hover .ic{background:var(--card-solid)}
.item div{min-width:0;flex:1}
.item b{display:block;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font-size:11.5px}
.item .go{color:var(--faint);font-size:16px}
.item.off{cursor:default}
.item.off:hover{background:none}
.vid{border-radius:14px;overflow:hidden;background:#0d1424;aspect-ratio:1;position:relative;max-width:100%}
.vid.r916{aspect-ratio:9/16;max-height:520px;margin:0 auto}
.vid video,.vid img{width:100%;height:100%;object-fit:contain;display:block}
.vid .yoq{display:grid;place-items:center;height:100%;color:#8fa0bf;font-size:12.5px;padding:20px;text-align:center}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px;margin-top:8px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card-solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.steps{display:flex;flex-direction:column;gap:2px}
.st{display:flex;gap:10px;align-items:center;font-size:13px;padding:4px 0;color:var(--muted)}
.st i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;flex:none;background:var(--chip);color:var(--faint)}
.st.d i{background:var(--blue);color:var(--on-blue)}
.st.d{color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:10px;background:var(--chip);text-decoration:none;cursor:pointer;border:0;color:var(--ink)}
.btn:hover{background:var(--blue-soft);color:var(--blue)}
.btn.p{background:var(--blue);color:var(--on-blue)}
.vcard{display:flex;gap:10px;align-items:center;padding:7px;border-radius:12px;cursor:pointer}
.vcard:hover{background:var(--chip)}
.vcard img,.vcard .ph0{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--chip);flex:none;display:grid;place-items:center}
.vcard>div{min-width:0}
.vcard b{display:block;font-size:13px;font-weight:700}
.vcard small{color:var(--muted);font-size:11.5px}
.mod{margin-bottom:9px}
.mod .t{display:flex;justify-content:space-between;font-size:13px}
.mod .t span{color:var(--muted);font-variant-numeric:tabular-nums}
.ritm{display:flex;align-items:flex-end;gap:2px;height:84px;padding-top:6px}
.ritm b{display:block;flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}
.ritm b.eng{background:var(--amber)}
.ritm-o{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:3px}
.kcard{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:12px}
.kcard:hover{background:var(--chip)}
.kcard>div:last-child{min-width:0}
.kcard b{display:block;font-size:13.5px}
.kcard small{color:var(--muted);font-size:12px}
.item .chip{flex:none}
.note{background:var(--note);color:var(--note-ink);border-radius:4px 12px 12px 12px;padding:9px 11px;margin-bottom:7px;font-size:12.5px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.note b{display:block;font-size:13px;margin-bottom:2px}
.cd{display:flex;gap:8px}
.cd>div{flex:1;background:var(--chip);border-radius:12px;padding:9px 8px;text-align:center;min-width:0}
.cd b{display:block;font:600 19px var(--f-display);font-variant-numeric:tabular-nums}
.cd small{font-size:11px;color:var(--muted)}
code{font:12px ui-monospace,Consolas,monospace;background:var(--chip);padding:2px 6px;border-radius:6px}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:700;padding:6px 0}

/* pastki kartalar */
.card{position:fixed;z-index:4;padding:12px 14px}
.pipe{left:var(--gl);bottom:var(--gb);width:min(640px,calc(100vw - 400px));display:flex;gap:14px;align-items:center}
.pipe .lft{flex:1;min-width:0}
.pipe .ttl{font-size:12px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:8px;min-width:0}
.pipe .ttl b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe .ttl .btn{padding:3px 9px}
.track{display:flex;align-items:flex-start}
.node{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:11px;color:var(--muted);text-align:center;min-width:0}
.node:not(:last-child)::after{content:"";position:absolute;top:13px;left:calc(50% + 15px);right:calc(-50% + 15px);height:3px;border-radius:3px;background:var(--chip)}
.node.d:not(:last-child)::after{background:var(--blue)}
.node i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-style:normal;font-size:13px;margin-bottom:4px;color:var(--faint)}
.node.d i{background:var(--blue);color:var(--on-blue)}
.node.c i{box-shadow:0 0 0 4px var(--blue-soft)}
.node span{max-width:100%;font-size:10.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ship{display:flex;gap:10px;align-items:center;padding-left:14px;border-left:1px solid var(--line);cursor:pointer;min-width:0}
.ship img,.ship .ph0{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--chip);flex:none}
.ship b{display:block;font-size:13.5px}
.ship small{display:block;color:var(--muted);font-size:11.5px}
.feed{right:var(--gr);bottom:var(--gb);width:340px;max-height:min(330px,calc(100vh - var(--gt) - var(--gb) - 64px - 360px));display:flex;flex-direction:column;padding:10px 6px 6px;transition:opacity .25s}
.feed.yigil{max-height:none}
.feed.yigil .fl{display:none}
.feed.yigil .tabs{border-bottom:0;padding-bottom:4px}
.tabs .yig{border:0;background:var(--chip);width:26px;height:26px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12px;align-self:center;padding:0}
.tabs .yig:hover{color:var(--ink)}
body.ochiq .feed{opacity:0;pointer-events:none}
.tabs{display:flex;gap:4px;padding:0 8px 8px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--chip);color:var(--ink)}
.tabs .n{margin-left:auto;align-self:center;font-size:11.5px;color:var(--faint);padding-right:4px}
.fl{overflow:auto;padding:4px 2px}
.ev{display:flex;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;align-items:flex-start}
.ev:hover{background:var(--chip)}
.ev .av{width:26px;height:26px;font-size:11px;border:0;margin-top:1px}
.ev>div{min-width:0}
.ev p{margin:0;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev small{color:var(--faint);font-size:11px}

/* 3D ichidagi yorliqlar */
.lbl{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;background:var(--card-solid);border-radius:22px;padding:5px 11px 5px 6px;box-shadow:0 6px 18px rgba(22,44,94,.16);font-weight:700;font-size:12.5px;white-space:nowrap;transition:transform .2s;color:var(--ink)}
.lbl:hover,.lbl.sel{transform:translateY(-3px)}
.lbl.sel{outline:2px solid var(--blue)}
.lbl .e{width:24px;height:24px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;font-size:13px}
.lbl .n{background:var(--blue);color:var(--on-blue);border-radius:10px;font-size:11px;padding:1px 7px}
.lbl .n.a{background:var(--amber);color:var(--on-blue)}
.lbl .new{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.pin{position:relative;display:flex;flex-direction:column;align-items:center}
.pin .drop{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--blue);display:grid;place-items:center;margin-top:6px;box-shadow:0 4px 10px rgba(47,107,222,.4);animation:bob 2.4s ease-in-out infinite}
.pin .drop::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--card-solid)}
@keyframes bob{50%{translate:0 -4px}}
.tl{pointer-events:auto;cursor:pointer;background:var(--card-solid);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;box-shadow:0 4px 12px rgba(22,44,94,.15);white-space:nowrap;display:flex;gap:6px;align-items:center;color:var(--ink)}
.tl em{font-style:normal;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--green-soft);color:var(--green)}
.tl em.a{background:var(--amber-soft);color:var(--amber)}
.tl em.o{background:var(--chip);color:var(--muted)}
.tl.sel{outline:2px solid var(--blue)}
.who{pointer-events:auto;cursor:pointer;background:var(--card-solid);border-radius:12px 12px 12px 3px;padding:6px 10px;font-size:11.5px;box-shadow:0 6px 16px rgba(22,44,94,.16);max-width:210px;color:var(--ink);transform:translate(50%,-10px)}
.who b{font-size:12px}
.who span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.who small{color:var(--faint)}
.uzoq .tl:not(.sel){display:none}
.uzoq .xona-pin:not(.tanl){display:none}
.labels:not(.yaqin2):not(.st-tanl) .tl[data-v]:not(.sel){display:none}
.yaqin:not(.yopiq) .office-pin:not(.tanl){display:none}
.yopiq .xona-pin{display:none}
.xona-pin .lbl{font-size:12px;padding:4px 10px 4px 5px}
.xona-pin .lbl .e{width:22px;height:22px;font-size:12px}
.oqim{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:3px 10px 3px 7px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:0 4px 12px rgba(22,44,94,.12)}
.oqim i{width:8px;height:8px;border-radius:50%;flex:none}
.yaqin .oqim,.oqimsiz .oqim{display:none}
.tl.kish{font-weight:600;color:var(--muted)}
/* Notion: auditoriya ranglari, mahsulotlar, tanlanganda chiqadigan yorliqlar */
.lbl .aud,.item .aud{width:9px;height:9px;border-radius:50%;flex:none}
.tag3d{pointer-events:none;background:var(--card-solid);border-radius:7px;padding:2px 8px;font-size:11px;font-weight:700;box-shadow:0 3px 10px rgba(22,44,94,.16);white-space:nowrap;color:var(--ink);display:flex;gap:6px;align-items:center}
.tag3d i{width:8px;height:8px;border-radius:50%;flex:none}
.tag3d.p{font-size:10px;padding:1px 6px;font-weight:600}
.tag3d.q{pointer-events:auto;cursor:pointer;transition:transform .15s}
.tag3d.q:hover{transform:translateX(3px);outline:2px solid var(--blue-soft)}
.tag3d.q.sel{background:var(--blue);color:var(--on-blue)}
.item.on{background:var(--blue-soft)}
.qtanla{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qtanla button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--card-solid);color:var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit}
.qtanla button:hover{border-color:var(--blue);background:var(--blue-soft)}
.qtanla span{font-size:10.5px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.qtanla b{font-size:13px;line-height:1.25}
.qtanla small{font-size:11.5px;color:var(--muted)}
.labels:not(.yaqin2) .tag3d.p{display:none}
.pr{padding:9px 8px;border-radius:12px;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr b{display:block;font-size:13.5px}
.pr small{display:block;color:var(--muted);font-size:12px}
.pr .bar{margin-top:7px}
.pr small.vz{font-size:11px;margin-top:3px}
.ads{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ad{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;border:1.5px dashed var(--c);color:var(--c)}
.ad.on{background:var(--c);color:#fff;border-style:solid}
.ads.big .ad{font-size:12px;padding:4px 10px;cursor:pointer}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kb>div{background:var(--chip);border-radius:10px;padding:7px 6px;text-align:center;min-width:0}
.kb b{display:block;font:600 17px var(--f-display)}
.kb small{display:block;font-size:10.5px;color:var(--muted);line-height:1.2}
.sec details summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:700;padding:6px 0}
p.t.nsrc{font-size:11.5px;color:var(--faint)}
.qv{padding:9px 8px;border-radius:12px;border-bottom:1px solid var(--line)}
.qv:last-of-type{border-bottom:0}
.qv-b{display:flex;gap:10px;align-items:flex-start}
.qv-b .ic{width:32px;height:32px;border-radius:9px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:15px}
.qv-b b{display:block;font-size:13.5px}
.qv-b small{color:var(--muted);font-size:12px}
.qv ul{margin:6px 0 0 42px;padding:0;font-size:12px;color:var(--muted)}
.qv li{margin-bottom:3px}
.qv li b{color:var(--ink);font-weight:700}
.qv-x{margin:6px 0 0 42px;display:grid;gap:4px}
.qv-x div{display:grid;grid-template-columns:1fr 70px 24px;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.qv-x i{display:block;height:6px;border-radius:4px;background:var(--blue)}
.qv-x b{text-align:right;color:var(--ink)}
.uzoq .tl.kish{display:none}
.uzoq .who{padding:4px 9px;border-radius:12px}
.uzoq .who span,.uzoq .who small,.uzoq .who br{display:none}

/* Claude chati (faqat lokal ofisda) */
.claude-btn{display:flex;align-items:center;gap:8px;height:50px;padding:0 14px 0 9px;border:0;cursor:pointer;font-weight:800;color:var(--ink)}
.claude-btn .cl-ic,.ch-ic{background:#d97757;color:#fff;display:grid;place-items:center;flex:none}
.claude-btn .cl-ic{width:30px;height:30px;border-radius:9px;font-size:16px}
.claude-btn.on{outline:2px solid #d97757}
.ishlar-btn .cl-ic{background:var(--green)}
/* Bajarilgan ishlar */
.filtr{display:flex;flex-direction:column;gap:8px}
.filtr>div{display:flex;flex-wrap:wrap;gap:6px}
.fch{border:1px solid var(--line);background:var(--card-solid);color:var(--muted);font:700 12.5px var(--f-body);padding:6px 12px;border-radius:20px;cursor:pointer}
.fch:hover{color:var(--ink)}
.fch.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stat .nuqta{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.stat .t{color:var(--muted);font-size:12px}
.ish{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;background:var(--card-solid)}
.ish-t{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ish-t b{font-size:14px;line-height:1.3}
.ish-t .chip{flex:none}
.ish>small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.ish .kim{font-weight:800}
.ogoh{margin-top:7px;background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:700;padding:6px 9px;border-radius:8px}
.qayer{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.qayer>span{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.ql{display:inline-flex;align-items:center;gap:3px;font:700 12px var(--f-body);color:var(--blue);background:var(--blue-soft);border:0;border-radius:8px;padding:4px 8px;text-decoration:none;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ql:hover{filter:brightness(.95)}
.ql.yoq{color:var(--muted);background:var(--chip);cursor:default}
.kun h4{margin:12px 0 6px;font-size:13px;display:flex;gap:6px;align-items:baseline}
.kun h4 small{color:var(--muted);font-weight:700}
.ev2{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ev2 .av{width:26px;height:26px;font-size:11px;border-width:0}
.ev2 p{margin:0;font-size:13px;line-height:1.35}
.ev2 small{color:var(--muted);font-size:11.5px}
.ev2 small a{color:inherit}
.ev2 .qayer{margin-top:5px}
/* panel qolipi: holat raqamlari, diqqat, kichik sarlavha, ma'lumotnoma */
.holat{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px}
.hs{background:var(--chip);border-radius:12px;padding:9px 10px;min-width:0}
.hs small{display:block;color:var(--muted);font-size:11px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.hs b{display:block;font:600 17px/1.2 var(--f-display);letter-spacing:-.01em;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hs b em{font:600 11px var(--f-body);color:var(--muted);font-style:normal}
.hs.g b{color:var(--green)}.hs.a b{color:var(--amber)}.hs.r b{color:var(--red)}
.diq{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:600;line-height:1.4;padding:8px 10px;border-radius:10px;margin-bottom:6px}
.diq i{font-style:normal;flex:none}
.diq.a{background:var(--amber-soft);color:var(--amber)}
.diq.r{background:var(--red-soft);color:var(--red)}
.diq[data-v],.diq[data-joy]{cursor:pointer}
.diq[data-v]:hover,.diq[data-joy]:hover{filter:brightness(.97)}
.kich{margin:12px 0 6px;font-size:12px;color:var(--muted);font-weight:800}
.sec>.kich:first-of-type{margin-top:0}
.malumot>summary{list-style:none;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:800;font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--chip)}
.malumot>summary::-webkit-details-marker{display:none}
.malumot>summary::after{content:"▸";margin-left:auto}
.malumot[open]>summary::after{content:"▾"}
.malumot .sec{padding:12px 0 0}
/* bino paneli: faqat xonalar ro'yxati */
.royxat .item{padding:12px 10px}
.royxat .item b{font-size:14.5px}
/* bazalar: ko'rinish yorliqlari va ko'rinishlar */
.bv-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -4px 10px;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.bv-tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:700 12.5px var(--f-body);padding:8px 9px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.bv-tabs button:hover{color:var(--ink)}
.bv-tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.bv-list .item .chip{margin-left:auto}
.bv-list .item .chip+.go{margin-left:6px}
.btab{overflow-x:auto}
.btab table{width:100%;border-collapse:collapse;font-size:12.5px}
.btab th{text-align:left;color:var(--faint);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.btab td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.btab tr[data-joy]{cursor:pointer}
.btab tr[data-joy]:hover td{background:var(--chip)}
.btab .tn{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.baza .ic{width:30px;height:30px;border-radius:9px;background:var(--chip);color:var(--blue);display:grid;place-items:center;flex:none;font-size:15px}
.bcard .ic{background:var(--blue-soft)}
.btab .tn .ic{width:26px;height:26px;font-size:14px}
.bboard{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.bcol{flex:1 0 200px;min-width:200px;background:var(--chip);border-radius:12px;padding:8px}
.bch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bch small{color:var(--muted);font-weight:800}
.bcard{background:var(--card-solid);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.bcard[data-joy]{cursor:pointer}
.bcard[data-joy]:hover{border-color:var(--blue)}
.bct{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bct .ic{width:26px;height:26px;font-size:14px}
.bcard small{display:block;color:var(--muted);font-size:11.5px}
.bbo{text-align:center;margin:6px 0}
.bgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;background:var(--card-solid)}
.gcard[data-joy]{cursor:pointer}
.gcard[data-joy]:hover{border-color:var(--blue)}
.gtop{width:100%;height:64px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:28px}
.gcard b{font-size:13.5px}
.btl-o{display:flex;justify-content:space-between;margin-left:38%;color:var(--faint);font-size:11px;font-weight:700;margin-bottom:6px}
.btl-r{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.btl-r[data-joy]{cursor:pointer}
.btl-n{width:38%;flex:none;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btl-n .ic{width:24px;height:24px;font-size:13px}
.btl-y{position:relative;flex:1;height:16px;background:var(--chip);border-radius:6px}
.btl-y i{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--blue)}
.btl-y i.g{background:var(--green)}.btl-y i.a{background:var(--amber)}.btl-y i.r{background:var(--red)}
.btl-y em{position:absolute;left:8px;top:0;font-size:11px;color:var(--faint);font-style:normal;line-height:16px}
/* SVG ikonlar (emoji o'rniga) — har OS'da bir xil */
.ik{display:inline-block;vertical-align:-.15em;flex:none}
.ic .ik,.big .ik,.e .ik,.res .ic .ik{color:var(--blue)}
.big .ik{width:22px;height:22px}
.item .ic .ik,.res .ic .ik{width:18px;height:18px}
.royxat .go{margin-left:auto;color:var(--faint);font-size:20px;line-height:1}
.chat{position:fixed;left:var(--gl);top:calc(var(--gt) + 64px);bottom:var(--gb);width:var(--chw,400px);max-width:calc(100vw - 32px);z-index:7;display:flex;flex-direction:column;overflow:hidden}
.chat[data-olcham="katta"]{width:min(860px,calc(100vw - 120px))}
.chat[data-olcham="toliq"]{width:auto;right:var(--gr);z-index:8}
.chat[data-olcham] .ch-m{font-size:15px;line-height:1.6}
.chat[data-olcham] .ch-x.c,.chat[data-olcham] .ch-q{max-width:min(92%,820px)}
.chat[data-olcham] .ch-x.u{max-width:min(75%,640px)}
/* katta va butun ekranda — toza, xiralashmagan fon */
.chat[data-olcham]{background:var(--card-solid);backdrop-filter:none;-webkit-backdrop-filter:none}
.chat[data-olcham="toliq"] .ch-status,.chat[data-olcham="toliq"] .ch-izoh{margin-inline:max(14px,calc((100% - 900px) / 2))}
.chat[data-olcham="toliq"] .ch-izoh{padding-inline:0}
/* butun ekranda matn markazdagi o'qish uchun qulay ustunda, aylantirish chizig'i esa oyna chetida */
.chat[data-olcham="toliq"] .ch-list,.chat[data-olcham="toliq"] .ch-tarix{padding-inline:max(14px,calc((100% - 900px) / 2))}
.chat[data-olcham="toliq"] .ch-form{padding-inline:max(14px,calc((100% - 900px) / 2))}
.chat[data-olcham="toliq"] .ch-rejim,.chat[data-olcham="toliq"] .ch-joy{margin-inline:max(14px,calc((100% - 900px) / 2))}
.ch-tutqich{position:absolute;top:0;right:0;bottom:0;width:8px;cursor:ew-resize;z-index:3}
.ch-tutqich:hover,.ch-tutqich.ushla{background:linear-gradient(90deg,transparent,var(--blue-soft))}
.chat[data-olcham="toliq"] .ch-tutqich{display:none}
body.chat-ochiq.chat-katta .tools,body.chat-ochiq.chat-katta .feed{visibility:hidden}
body.chat-ochiq .kpis,body.chat-ochiq .pipe{visibility:hidden}
.ch-bosh{display:flex;gap:10px;align-items:center;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.ch-nom{min-width:0;flex:1}
.ch-ic{width:36px;height:36px;border-radius:10px;font-size:18px}
.ch-nom b{display:block;font:600 15px var(--f-display)}
.ch-nom small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-tugmalar{display:flex;gap:4px;flex:none}
.ch-btn{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border:0;border-radius:9px;background:var(--chip);color:var(--ink);font:700 12.5px var(--f-body);cursor:pointer;white-space:nowrap}
.ch-btn:hover{background:var(--blue-soft);color:var(--blue)}
.ch-btn.on{background:var(--blue);color:var(--on-blue)}
.ch-btn.yop{width:32px;padding:0;justify-content:center;color:var(--muted)}
.chat:not([data-olcham]) #chKattaT{display:none}
.ch-rejim{margin:10px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch-rejim button{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--card-solid);border-radius:12px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.ch-rejim button b{font-size:13px}
.ch-rejim button small{font-size:11px;color:var(--muted);line-height:1.3}
.ch-rejim button:hover{border-color:var(--faint)}
.ch-rejim button.on{border-color:var(--blue);background:var(--blue-soft)}
.ch-rejim button[data-r="ish"].on{border-color:var(--amber);background:var(--amber-soft)}
.ch-status{display:flex;align-items:center;gap:8px;margin:0 14px 8px;padding:7px 8px 7px 12px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:12.5px;font-weight:700}
#chStatusT{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-status .btn{padding:4px 10px;flex:none}
.ch-status .ch-yoz i{background:var(--blue)}
.ch-izoh{padding:0 14px 10px;margin-top:-6px;font-size:11.5px;color:var(--muted)}
.ch-x{display:flex;flex-direction:column;gap:3px;max-width:90%}
.ch-x.u{align-self:flex-end;align-items:flex-end}
.ch-x.c{align-self:flex-start}
.ch-x .ch-m{max-width:none}
.ch-meta{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--faint);padding:0 4px}
.ch-nus{border:0;background:none;color:var(--muted);font:700 11px var(--f-body);cursor:pointer;padding:0;opacity:0;transition:opacity .15s}
.ch-x:hover .ch-nus,.ch-nus:focus-visible{opacity:1}
.ch-nus:hover{color:var(--blue)}
.ch-q{align-self:flex-start;max-width:90%;font-size:12px;color:var(--muted)}
.ch-q summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:center;padding:4px 10px;border-radius:9px;background:var(--chip);overflow:hidden}
.ch-q summary .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-q summary::-webkit-details-marker{display:none}
.ch-q summary::before{content:"▸";font-size:10px;flex:none}
.ch-q[open] summary::before{content:"▾"}
.ch-q-list{padding:6px 10px 2px 22px;display:flex;flex-direction:column;gap:3px}
.ch-list{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.ch-m{padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.ch-m.u{align-self:flex-end;background:var(--blue);color:var(--on-blue);border-bottom-right-radius:4px;white-space:pre-wrap}
.ch-m.c{align-self:flex-start;background:var(--chip);border-bottom-left-radius:4px}
.ch-m.c p{margin:0 0 7px}
.ch-m.c p:last-child{margin:0}
.ch-m.c ul,.ch-m.c ol{margin:4px 0 8px;padding-left:20px}
.ch-m.c li{margin:2px 0}
.ch-m.c li::marker{color:var(--muted)}
.ch-m.c pre{margin:6px 0;padding:9px 11px;background:var(--card-solid);border-radius:10px;overflow-x:auto;font:12.5px/1.5 ui-monospace,Consolas,monospace}
.ch-m.c pre code{background:none;padding:0}
.ch-m.c .sar{display:block;font-weight:800;margin:4px 0 2px}
.ch-m.c code{background:var(--card-solid)}
.ch-m.c a{color:var(--blue)}
.ch-m.xato{background:var(--red-soft);color:var(--red)}
.ch-a{align-self:flex-start;font-size:11.5px;color:var(--muted);padding-left:4px;overflow-wrap:anywhere}
.ch-kirish{background:var(--amber-soft);color:var(--ink);border-radius:14px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.ch-kirish b{font-size:13.5px}
.ch-joy{margin:0 14px 2px;font-size:11.5px;color:var(--muted)}
.ch-form{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line);align-items:flex-end}
.ch-form textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit;font-size:13.5px;background:var(--card-solid);color:var(--ink);max-height:140px}
.ch-form textarea:focus{outline:none;border-color:var(--blue)}
.ch-form .btn{flex:none}
.chat.tarix-ochiq>:not(.ch-bosh):not(.ch-tarix){display:none}
.ch-tarix{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ch-tarix h4{margin:4px 4px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.ch-s{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:12px;cursor:pointer;color:var(--ink);font:inherit}
.ch-s:hover,.ch-s.on{background:var(--chip)}
.ch-s b{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-s small{color:var(--muted);font-size:11.5px}
.ch-s.yangi{background:var(--blue-soft);color:var(--blue);flex-direction:row;align-items:center;gap:8px;font-weight:800;margin-bottom:6px}
.ch-yoz{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.ch-yoz i{width:5px;height:5px;border-radius:50%;background:var(--faint);animation:bob 1s ease-in-out infinite}
.ch-yoz i:nth-child(2){animation-delay:.15s}
.ch-yoz i:nth-child(3){animation-delay:.3s}

#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;padding:18px 22px;max-width:min(420px,calc(100vw - 32px));text-align:center}
#yuk{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:var(--bg);transition:opacity .6s}
#yuk.off{opacity:0;pointer-events:none}
#yuk div{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-weight:700}
#yuk .logo{width:54px;height:54px;font-size:24px;animation:bob 1.4s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:680px) and (min-width:761px){.feed{display:none}}

  .kpi b{font-size:17px}

  .panel{left:0;right:0;top:auto;bottom:0;width:auto;height:68vh;border-radius:20px 20px 0 0;transform:translateY(105%);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  body.p-markaz .panel{left:0;right:0;top:auto;bottom:0;width:auto;height:88vh;border-radius:20px 20px 0 0;transform:translateY(105%)}
  body.ochiq.p-markaz .panel{transform:none}
  body.p-markaz .ph,body.p-markaz .sec,body.p-toliq .ph,body.p-toliq .sec{padding-inline:16px}
  body.p-markaz .panel>*,body.p-toliq .panel>*{zoom:1}
  body.p-toliq .panel{height:auto}
  .pipe .ship,.node span{display:none}
  .oqim{display:none}
  .claude-btn{height:44px;padding:0 8px}
  .claude-btn span:last-child{display:none}
  .chat,.chat[data-olcham]{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;height:78vh;border-radius:20px 20px 0 0}
  .chat[data-olcham="toliq"]{top:0;height:auto}
  .ch-tutqich{display:none}
}

<script type="module">
const S = JSON.parse(document.getElementById('shifr').textContent);
const KALIT = 'oson-office-kalit';
const enc = new TextEncoder();
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const s64 = (u) => btoa(String.fromCharCode(...u));
const sub = crypto.subtle;

async function loginId(login) {
  return s64(new Uint8Array(await sub.digest('SHA-256', enc.encode('oson-office:' + login.trim().toLowerCase()))));
}
async function kalitOl(login, parol) {
  const id = await loginId(login);
  const u = S.users.find((x) => x.id === id) || { ...S.users[0], id: null };
  const base = await sub.importKey('raw', enc.encode(parol), 'PBKDF2', false, ['deriveKey']);
  const kek = await sub.deriveKey({ name: 'PBKDF2', salt: b64(u.salt), iterations: S.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  if (!u.id) throw new Error('login');
  return new Uint8Array(await sub.decrypt({ name: 'AES-GCM', iv: b64(u.iv) }, kek, b64(u.key)));
}
async function och(raw) {
  const k = await sub.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await sub.decrypt({ name: 'AES-GCM', iv: b64(S.iv) }, k, b64(S.data))));
}
async function boshla(p) {
  // hujjatlar shifr ichida keladi — ochilganda brauzerning o'zida sahifa bo'lib ochiladi
  for (const z of p.data.zonalar) for (const n of z.narsalar) {
    if (n.url?.startsWith('hujjat:')) n.url = URL.createObjectURL(new Blob([p.hujjatlar[n.url.slice(7)]], { type: 'text/html' }));
  }
  window.OFFICE_DATA = p.data;
  window.OFFICE_CHIQISH = async () => {
    try { localStorage.removeItem(KALIT); sessionStorage.setItem('oson-office-chiqdi', '1'); } catch {}
    try { await navigator.credentials?.preventSilentAccess?.(); } catch {}
    location.reload();
  };
  document.getElementById('kirish').hidden = true;
  // sahna kodi ham shifr ichida keladi; 'three' importlari sahifadagi importmap orqali topiladi
  await import(URL.createObjectURL(new Blob([p.app], { type: 'text/javascript' })));
}

// Chrome/Edge parol menejeri: kirgandan keyin "Parolni saqlaysizmi?" deb so'raydi, keyingi safar o'zi to'ldiradi.
// Forma JS bilan yuborilgani uchun (sahifa qayta yuklanmaydi) Chrome buni o'zi sezmaydi — shuning uchun aniq aytamiz.
const PK = 'PasswordCredential' in window && navigator.credentials;
async function parolSaqla(login, parol) {
  if (!PK) return;
  try { await navigator.credentials.store(new PasswordCredential({ id: login.trim().toLowerCase(), password: parol, name: 'Oson Office' })); } catch {}
}
async function parolBilanKir(login, parol, esla) {
  const raw = await kalitOl(login, parol);
  const p = await och(raw);
  if (esla) { try { localStorage.setItem(KALIT, s64(raw)); } catch {} }
  return p;
}

let saqlangan = null, kirdi = false;
try { saqlangan = localStorage.getItem(KALIT); } catch {}
if (saqlangan) {
  try { await boshla(await och(b64(saqlangan))); kirdi = true; }
  catch { try { localStorage.removeItem(KALIT); } catch {} }
}
// Brauzerda saqlangan parol bo'lsa — so'ramasdan kiradi (Chrome bir marta hisobni tanlatishi mumkin)
let chiqdi = false;
try { chiqdi = !!sessionStorage.getItem('oson-office-chiqdi'); } catch {}
if (!kirdi && PK && !chiqdi) {
  try {
    const c = await navigator.credentials.get({ password: true, mediation: 'optional' });
    if (c?.password) { await boshla(await parolBilanKir(c.id, c.password, true)); kirdi = true; }
  } catch {}
}
if (!kirdi) document.getElementById('yuk').classList.add('off');

document.getElementById('k-forma').addEventListener('submit', async (e) => {
  e.preventDefault();
  const tugma = document.getElementById('k-tugma'), xato = document.getElementById('k-xato');
  tugma.disabled = true; tugma.textContent = 'Tekshirilmoqda…'; xato.textContent = '';
  try {
    const login = document.getElementById('k-login').value, parol = document.getElementById('k-parol').value;
    const p = await parolBilanKir(login, parol, document.getElementById('k-esla').checked);
    await parolSaqla(login, parol);
    await boshla(p);
  } catch {
    xato.textContent = "Login yoki parol noto'g'ri. Qaytadan kiriting.";
    tugma.disabled = false; tugma.textContent = 'Kirish';
    document.getElementById('k-parol').select();
  }
});
</script>
