<style>
  /* Darslar rejasi sahifasi bilan bir uslubda: och fon, oq kartalar, ko'k aksent, Golos Text */
  :root {
    --bg: #F4F6FA; --panel: #FFFFFF; --line: #DDE3EC; --ink: #14213A; --mute: #5E6C84;
    --accent: #1A6DE0; --soft: #E6EFFC; --on-accent: #FFFFFF;
    --ok: #1F9D55; --ok-soft: #E3F5EA; --warn: #C77C02; --warn-soft: #FDF1DC; --grey-soft: #EEF1F6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1522; --panel: #18202F; --line: #2A3446; --ink: #E8EDF5; --mute: #97A3B8;
      --accent: #5B9BFF; --soft: #1E2B42; --on-accent: #0F1522;
      --ok: #4CC27E; --ok-soft: #173326; --warn: #E9A93A; --warn-soft: #3A2D14; --grey-soft: #222B3B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1522; --panel: #18202F; --line: #2A3446; --ink: #E8EDF5; --mute: #97A3B8;
    --accent: #5B9BFF; --soft: #1E2B42; --on-accent: #0F1522;
    --ok: #4CC27E; --ok-soft: #173326; --warn: #E9A93A; --warn-soft: #3A2D14; --grey-soft: #222B3B;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Golos Text", "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-block: clamp(20px, 3vw, 44px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
  h1 { margin: 0 0 4px; font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 800; line-height: 1.15; text-wrap: balance; }
  h2 { margin: 0 0 10px; font-size: 1.3rem; font-weight: 800; }
  .sub { margin: 0; color: var(--mute); }
  .sub a { color: var(--accent); }
  .num { font-variant-numeric: tabular-nums; }

  .umumiy { background: var(--accent); color: var(--on-accent); border-radius: 16px; padding: 16px 22px; display: flex; flex-wrap: wrap; gap: 6px 28px; }
  .umumiy div { display: flex; flex-direction: column; }
  .umumiy b { font-size: 2rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .umumiy span { opacity: .9; font-size: .88rem; }

  .karta { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; min-width: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  th { border-top: 0; color: var(--mute); font-weight: 500; font-size: .85rem; }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tfoot td { font-weight: 800; }
  .izoh { margin: 10px 0 0; color: var(--mute); font-size: .85rem; }
  .jadval-ich { overflow-x: auto; }

  .kunlar { display: flex; flex-wrap: wrap; gap: 8px; }
  .kunlar button { font: inherit; font-size: .9rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .kunlar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .dars { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .dars > summary { list-style: none; cursor: pointer; padding: 16px 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; }
  .dars > summary::-webkit-details-marker { display: none; }
  .dars .id { font-weight: 800; color: var(--accent); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .dars .nom { font-weight: 700; }
  .dars .nom small { display: block; font-weight: 400; color: var(--mute); font-size: .85rem; }
  .teg { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .teg.tasdiqqa { background: var(--warn-soft); color: var(--warn); }
  .teg.loyiha { background: var(--grey-soft); color: var(--mute); }
  .teg.tasdiqlandi { background: var(--ok-soft); color: var(--ok); }
  .ich { padding: 0 20px 20px; display: grid; gap: 16px; }
  .muammo { background: var(--soft); border-radius: 12px; padding: 10px 14px; }
  .qism h3 { margin: 0 0 6px; font-size: .95rem; font-weight: 800; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; }
  .qism h3 span { font-weight: 500; color: var(--mute); }
  .qism ol, .qism ul { margin: 0; padding-left: 20px; }
  .qism li { margin: 3px 0; }
  .kadr { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .kadr:first-of-type { border-top: 0; }
  .kadr .g { color: var(--mute); font-size: .9rem; grid-column: 1; }
  .kadr .k { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: .85rem; color: var(--mute); white-space: nowrap; }
  .kadr .k b { display: block; color: var(--ink); font-size: 1rem; font-variant-numeric: tabular-nums; }
  .savollar { background: var(--warn-soft); border-radius: 12px; padding: 12px 14px; }
  .savollar h3 { color: var(--warn); }
  .meta { color: var(--mute); font-size: .85rem; margin: 0; }
  .qoidalar li { margin: 4px 0; }
  .ochish { display: flex; gap: 8px; flex-wrap: wrap; }
  .ochish button { font: inherit; font-size: .85rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }

  @media (max-width: 640px) {
    .dars > summary { grid-template-columns: auto 1fr; }
    .dars > summary .teg { grid-column: 2; justify-self: start; }
    .umumiy b { font-size: 1.6rem; }
    th, td { padding: 7px 6px; }
    #kredit th:nth-child(3), #kredit td:nth-child(3) { display: none; }
  }
</style>

ko'rinmasligi videoda aytilmagan — shuni dasturda tekshirish kerakmi?"]},{"id":"1.13","nomi":"Markirovkali mahsulotni sotish","sana":"2026-11-23","holat":"loyiha","manba":"«Касса тулик» 42:23–43:29 (Маркировка товара, skaner), 36:01 (История маркировки), 52:27–53:06 (Мар ustuni, Отложенные чеки); «Управления, Настройки пользователя» 04:55–05:40 va 06:26 (majburiy skanerlash, Проверка маркировки); «Отчеты 21-27» 00:00–00:53 (Продажа с маркировкой)","muammo":"Mijoz markirovkali dori so'radi — farmatsevt kodni skanerlamasdan sotib yuborsa, dorixonaga katta jarima [T] kutadi.","sahna":[{"kadr":"O'rta yoshli ayol mijoz peshtaxta oldida dori qutisini ko'rsatib, shoshib gapiradi","gap":"Mijoz: «Mana shu dorini bering, tezroq bo'lsa, ishga kechikyapman!»","model":"seedance","kredit":0},{"kadr":"Farmatsevt yigit dori qutisini qo'lida aylantirib, ustidagi kvadrat belgiga ikkilanib qaraydi","gap":"Farmatsevt: «Bunda kvadrat kod bor ekan… buni nima qilish kerak edi?»","model":"seedance","kredit":0}],"rasmlar":2,"promo":["Ba'zi dorilarning qutisida maxsus kvadrat kod — markirovka bo'ladi.","Bunday dori sotilganda kod skanerlanishi shart.","Skanerlamasdan sotilsa — dorixona katta jarimaga tushishi mumkin.","Dastur esa bunga yo'l qo'ymaydi: kod kiritilmaguncha sotuv davom etmaydi.","Bitta kod bilan bitta qadoqdan ko'p dori sotib bo'lmaydi.","Endi buni Oson Kassa dasturida ko'rib chiqamiz."],"texnik":["Majburiy skanerlash sozlamasi (admin): «Сделать обязательным сканирование кода маркировки при продаже» — yoqilsa, belgisi bor mahsulotni markirovka kodisiz sotib bo'lmaydi (Управления, 04:55).","Mahsulotlar ro'yxatida «Маркируется» ustuni — markirovkalanadigan mahsulotda belgi turadi (Управления, 05:10).","Shtrix-skaner sozlangan bo'lsa, mahsulot skanerdan o'tkazilganda shtrix-kod yoki markirovka kodi bo'yicha dastur uni o'zi topib chekka qo'shadi (Касса тулик, 43:29).","Fiskalizatsiya oynasi: «Учитывать отсканированные маркировки» yoqilgan bo'lsa, skanerlangan kodlar tekshiriladi (4 atida)","muammo":"Mudira smenada kim qancha sotganini so'raydi — farmatsevt hisobot qayerda ekanini bilmaydi.","sahna":[{"kadr":"Dorixona mudirasi (o'rta yoshli ayol) peshtaxta orqasidan monitorga qarab, farmatsevtdan so'raydi","gap":"Mudira: «Bugun kim qancha savdo qilganini ko'rmoqchiman. Hisobotni ochib bera olasizmi?»","model":"seedance","kredit":0},{"kadr":"Farmatsevt monitorga qaraydi, sichqonchaga qo'l cho'zadi, ikkilanadi (1-kadr oxiridan, gapsiz)","gap":"—","model":"seedance","kredit":0}],"rasmlar":2,"promo":["Kassada savdo haqidagi hisobotlar dasturning o'zida — alohida dasturga o'tish shart emas.","Kim qancha va qanday savdo qilgani — kassirlar bo'yicha ko'rinadi.","Bitta mahsulot bilan nima bo'lgani — sotuv va qaytarish — tovar harakatida.","Markirovkali mahsulot qancha sotilgani ham alohida hisobotda.","Chuqurroq ma'lumot kerak bo'lsa, dastur sizni admin qismidagi batafsil hisobotga olib o'tadi.","Endi buni Oson Kassa dasturida ko'rib chiqamiz."],"texnik":["Menyu «Отчеты» — ro'yxat: «Движение товара», «Детализация», «Продажа по кассирам», «История маркировки», «Система баллов» (05:11).","«Продажа по кассирам» — hamma kassirlar bo'yicha kim qancha va qanday savdo qilgani (35:45).","«Движение товара» → «Обновить» → mahsulotlar ro'yxati (34:52).","Mahsulot tanlanadi → pastda jarayonlari: sotuv, qaytarish; ustunlar «Тип документ», «Кассир» (34:52).","Oynadagi yozuv: «Для подробной информации воспользуйтесь отчетом «Детализация» на админ портале» (35:12).","«Детализация» bandi admin qismidagi «Детализация» hisobotiga olib o'tadi — u yerda tovar kirimdan oxirigacha (35:20, 35:45).","«История маркировки» — markirovka kodi bilan sotilgan miqdor (36:01) — faqat aytib o'tiladi."],"nusxa":"Yo'q (assets/kassa-*.js ichida «Отчеты» menyusi va oynalari yo'q). Yangi: «Отчеты» menyu ro'yxati; «Движение товара» oynasi («Обновить», mahsulotlar jadvali, pastda jarayonlar: Тип документ, Кассир); «Продажа по кассирам» jadvali. Asos: assets/kassa-real.js (menyu qatori) va kassa-cheki.js (jadval uslubi).","savollar":["«Продажа по кассирам» va «История маркировки» oynalari videoda ko'rsatilmagan, faqat aytilgan — ustunlari noma'lum. Otajon akaning boshqa videosi yoki test kassadan skrinshot bera olasizmi, yo'qsa jadval ustunlarini umumiy qoldiramizmi?","«Система баллов» videoda «keyinroq ko'riladi» deyilgan (motivatsiya) — bu darsga kirsinmi yoki alohida dars bo'ladimi?","Kurs rejasida «Kassir bo'yicha savdo, markirovka tarixi, ball tizimi hisoboti» deyilgan; «Движение товара» ham qo'shilsinmi (videoda u asosiy ko'rsatilgan)?","«X, Z отчеты» — virtual kassaga tegishli deyilgan (04:06); darsga kiritmaymizmi?","Smena hisoboti (1.19) bilan chegara: bu darsda faqat «Отчеты» menyusi, «Смена» oynasi — 1.19 da. To'g'rimi?"]}]};
const OY = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const HAFTA = ['yakshanba','dushanba','seshanba','chorshanba','payshanba','juma','shanba'];
const sana = s => { const d = new Date(s + 'T00:00'); return `${d.getDate()}-${OY[d.getMonth()]}, ${HAFTA[d.getDay()]}`; };
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HOLAT = { tasdiqqa: 'Tasdiqqa berilgan', loyiha: 'Loyiha', tasdiqlandi: 'Tasdiqlandi' };
const MODEL = { fast6: 'Veo Fast 6 s', fast4: 'Veo Fast 4 s', lite: 'Veo Lite', wan: 'Wan 2.7' };
const kredit = d => d.rasmlar * 2 + d.sahna.reduce((a, k) => a + k.kredit, 0);
const zaxira = k => Math.ceil(k * 1.5 / 5) * 5;

const D = S.darslar;
const jami = D.reduce((a, d) => a + kredit(d), 0);
const savolSoni = D.reduce((a, d) => a + d.savollar.length, 0);
document.getElementById('sub').innerHTML = `${sana(D[0].sana)} — ${sana(D[D.length - 1].sana)} · yangilandi ${esc(S.yangilandi)} · <a href="../reja/">Darslar rejasi →</a>`;
document.getElementById('umumiy').innerHTML = [
  [D.length, 'dars'], [jami, 'kredit (hisob)'], [zaxira(jami), 'kredit (zaxira bilan)'], [savolSoni, 'ochiq savol']
].map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('');

document.getElementById('kredit').innerHTML =
  `<thead><tr><th>Dars</th><th>Sana</th><th>Kadrlar</th><th class="r">Hisob</th><th class="r">Zaxira bilan</th></tr></thead><tbody>` +
  D.map(d => `<tr><td><b>${d.id}</b> ${esc(d.nomi)}</td><td>${sana(d.sana).split(',')[0]}</td><td>${d.rasmlar} rasm + ${d.sahna.map(k => MODEL[k.model]).join(', ')}</td><td class="r">${kredit(d)}</td><td class="r">${zaxira(kredit(d))}</td></tr>`).join('') +
  `</tbody><tfoot><tr><td>Jami</td><td></td><td></td><td class="r">${jami}</td><td class="r">${D.reduce((a, d) => a + zaxira(kredit(d)), 0)}</td></tr></tfoot>`;
document.getElementById('kreditIzoh').textContent = `${S.narxlar.izoh} Narxlar: ${S.narxlar.rasm}; ${S.narxlar.fast6}; ${S.narxlar.fast4}; ${S.narxlar.lite}; ${S.narxlar.wan}. Ovoz: ${S.narxlar.ovoz}.`;
document.getElementById('qoidalar').innerHTML = S.umumiy_qoidalar.map(q => `<li>${esc(q)}</li>`).join('');

const kunlar = [...new Set(D.map(d => d.sana))];
let tanlov = 'hammasi';
function chiz() {
  document.getElementById('kunlar').innerHTML = [['hammasi', 'Hammasi'], ...kunlar.map(k => [k, sana(k).split(',')[0]])]
    .map(([k, n]) => `<button data-k="${k}" aria-pressed="${tanlov === k}">${n}</button>`).join('');
  document.getElementById('darslar').innerHTML = D.filter(d => tanlov === 'hammasi' || d.sana === tanlov).map(d => `
    <details class="dars" id="d${d.id.replace('.', '-')}">
      <summary>
        <span class="id">${d.id}</span>
        <span class="nom">${esc(d.nomi)}<small>${sana(d.sana)} · ${kredit(d)} kredit · ${d.savollar.length} savol</small></span>
        <span class="teg ${d.holat}">${HOLAT[d.holat] || esc(d.holat)}</span>
      </summary>
      <div class="ich">
        <div class="muammo"><b>Muammo:</b> ${esc(d.muammo)}</div>
        <div class="qism"><h3>1. Sahna <span>${d.rasmlar} rasm (${d.rasmlar * 2}) + kadrlar = ${kredit(d)} kredit</span></h3>
          ${d.sahna.map((k, i) => `<div class="kadr"><div>${i + 1}. ${esc(k.kadr)}</div><div class="g">${esc(k.gap)}</div><div class="k">${MODEL[k.model]}<b>${k.kredit}</b></div></div>`).join('')}
        </div>
        <div class="qism"><h3>2. Promo <span>Gulnoza, ~45 s, dastur ko'rsatilmaydi</span></h3><ol>${d.promo.map(p => `<li>${esc(p)}</li>`).join('')}<li>«Endi buni Oson Kassa dasturida ko'rib chiqamiz.»</li></ol></div>
        <div class="qism"><h3>3. Texnik qism <span>Kassa nusxasi, ruscha</span></h3><ol><li>«Keling, … ko'rib chiqamiz.»</li>${d.texnik.map(p => `<li>${esc(p)}</li>`).join('')}<li>«Oson Kassa bilan barchasi oson!»</li></ol></div>
        <p class="meta"><b>Kassa nusxasi:</b> ${esc(d.nusxa)}</p>
        <p class="meta"><b>Manba:</b> ${esc(d.manba)}</p>
        ${d.savollar.length ? `<div class="qism savollar"><h3>Savollar</h3><ol>${d.savollar.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>` : ''}
      </div>
    </details>`).join('');
}
document.getElementById('kunlar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tanlov = b.dataset.k; chiz(); } });
document.getElementById('hammasi').onclick = () => document.querySelectorAll('.dars').forEach(d => d.open = true);
document.getElementById('yigish').onclick = () => document.querySelectorAll('.dars').forEach(d => d.open = false);
chiz();
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) { el.open = true; el.scrollIntoView(); } }
</script>
