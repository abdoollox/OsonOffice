<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Oson Updater · Ishlar</title>
<!-- Oson Updater Mini App (Telegram). Manba: OsonProjects/updater/webapp/, ma'lumot: updater-api.osonacademy.uz (updater/api/).
     Ranglar — Oson tokenlari (sinxron-taqdimot/uslub/tokens.css), fon va matn Telegram mavzusiga moslashadi. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: var(--tg-theme-secondary-bg-color, #f6f7f9);
  --surface: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --sunken: color-mix(in srgb, var(--text) 5%, var(--surface));
  --text: var(--tg-theme-text-color, #191c21);
  --muted: var(--tg-theme-hint-color, #646973);
  --line: color-mix(in srgb, var(--text) 12%, transparent);
  --accent: #0074d6;
  --accent-soft: color-mix(in srgb, #0074d6 14%, var(--surface));
  --accent-text: color-mix(in srgb, #0074d6 75%, var(--text));
  --success: #34c759;
  --success-text: color-mix(in srgb, #1f8a3d 80%, var(--text));
  --success-soft: color-mix(in srgb, #34c759 16%, var(--surface));
  --warning: #ff8d28;
  --warning-text: color-mix(in srgb, #b25800 80%, var(--text));
  --warning-soft: color-mix(in srgb, #ff8d28 16%, var(--surface));
  --danger-text: color-mix(in srgb, #d0021b 80%, var(--text));
  --danger-soft: color-mix(in srgb, #ff383c 14%, var(--surface));
  --r-tile: 12px; --r-card: 16px;
  --font: Inter, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
h1 { font-size: 24px; font-weight: 600; margin: 4px 0 2px; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 24px 4px 8px; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ro'yxat */
.ish { display: block; width: 100%; background: var(--surface); border-radius: var(--r-card); padding: 14px 16px; margin-bottom: 10px; }
.ish-bosh { display: flex; align-items: baseline; gap: 8px; }
.ish-nom { font-size: 17px; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.chip { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.holat { margin: 6px 0 10px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.nuqta { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent); }
.holat.kut .nuqta { background: var(--warning); } .holat.kut { color: var(--warning-text); font-weight: 500; }
.holat.xato .nuqta { background: #ff383c; } .holat.xato { color: var(--danger-text); font-weight: 500; }
.holat.tayyor .nuqta { background: var(--success); }
.chiziq { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.chiziq i { height: 6px; border-radius: 3px; background: var(--line); }
.chiziq i.t { background: var(--accent); }
.chiziq i.j { background: var(--accent); opacity: .45; animation: puls 1.6s ease-in-out infinite; }
.chiziq i.k { background: var(--warning); }
.chiziq i.x { background: #ff383c; }
@keyframes puls { 50% { opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .chiziq i.j { animation: none; } }
.ish-oyoq { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* batafsil */
.blok { background: var(--surface); border-radius: var(--r-card); padding: 4px 0; }
.qadam { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 16px; position: relative; }
.qadam + .qadam::before { content: ""; position: absolute; left: 29px; top: -10px; height: 20px; width: 2px; background: var(--line); }
.qadam.t + .qadam::before { background: var(--accent); }
.belgi { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600;
  background: var(--sunken); color: var(--muted); font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.qadam.t .belgi { background: var(--accent); color: #fff; }
.qadam.j .belgi { background: var(--accent-soft); color: var(--accent-text); box-shadow: inset 0 0 0 2px var(--accent); }
.qadam.k .belgi { background: var(--warning-soft); color: var(--warning-text); box-shadow: inset 0 0 0 2px var(--warning); }
.qadam.x .belgi { background: var(--danger-soft); color: var(--danger-text); }
.qadam-nom { font-weight: 500; padding-top: 3px; }
.qadam:not(.t):not(.j):not(.k):not(.x) .qadam-nom { color: var(--muted); font-weight: 400; }
.qadam-izoh { font-size: 13px; color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
.qadam.k .qadam-izoh { color: var(--warning-text); }
.qadam.x .qadam-izoh { color: var(--danger-text); }
.savol { padding: 12px 16px; }
.savol + .savol { border-top: 1px solid var(--line); }
.savol-m { font-weight: 500; }
.savol-j { font-size: 14px; margin-top: 4px; color: var(--success-text); }
.savol-j.yoq { color: var(--warning-text); }
details.blok { padding: 0; }
details summary { list-style: none; padding: 14px 16px; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "Ochish"; color: var(--accent-text); font-weight: 400; font-size: 14px; }
details[open] summary::after { content: "Yopish"; }
.loyiha { padding: 0 16px 16px; white-space: pre-wrap; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.orqa { color: var(--accent-text); font-size: 15px; padding: 4px 0 8px; }

/* holatlar: yuklanmoqda, xato, bo'sh */
.ekran { text-align: center; padding: 64px 24px; }
.ekran .tile { width: 80px; height: 80px; border-radius: 20px; background: var(--accent-soft); margin: 0 auto 16px; display: grid; place-items: center; }
.ekran .tile svg { width: 36px; height: 36px; fill: var(--accent); }
.ekran b { display: block; font-size: 17px; margin-bottom: 4px; }
.ekran p { color: var(--muted); margin: 0; text-wrap: balance; }
.yuk .tile svg { animation: aylan 1.2s linear infinite; }
@keyframes aylan { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main id="ilova" aria-live="polite"></main>
<script>
const API = 'https://updater-api.osonacademy.uz/api/ishlar';
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const IKON = {
  video: '<svg viewBox="0 0 256 256"><path d="M251.77 73a8 8 0 0 0-8.21.39L208 97.05V72a16 16 0 0 0-16-16H32a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16v-25l35.56 23.71A8 8 0 0 0 248 184a8 8 0 0 0 8-8V80a8 8 0 0 0-4.23-7"/></svg>',
  aylan: '<svg viewBox="0 0 256 256"><path d="M136 32v32a8 8 0 0 1-16 0V32a8 8 0 0 1 16 0m88 88h-32a8 8 0 0 0 0 16h32a8 8 0 0 0 0-16m-45.09 47.6a8 8 0 0 0-11.31 11.31l22.62 22.63a8 8 0 0 0 11.32-11.32ZM128 184a8 8 0 0 0-8 8v32a8 8 0 0 0 16 0v-32a8 8 0 0 0-8-8m-50.91-16.4-22.63 22.62a8 8 0 0 0 11.32 11.32l22.62-22.63a8 8 0 0 0-11.31-11.31M72 128a8 8 0 0 0-8-8H32a8 8 0 0 0 0 16h32a8 8 0 0 0 8-8m-6.22-73.54a8 8 0 0 0-11.32 11.32l22.63 22.62a8 8 0 0 0 11.31-11.31Z"/></svg>',
  qulf: '<svg viewBox="0 0 256 256"><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16M96 56a32 32 0 0 1 64 0v24H96Z"/></svg>',
};
const ekran = (ikon, sarlavha, matn, cls = '') => `<div class="ekran ${cls}"><div class="tile">${IKON[ikon]}</div><b>${esc(sarlavha)}</b><p>${esc(matn)}</p></div>`;

let data = null, tanlangan = null, ochiqLoyiha = false;
const KUTISH = { savollar: (i) => `PM javobini kutyapti${i.javobsiz ? ` · ${i.javobsiz} ta savol` : ''}`,
  'loyiha-tasdiq': () => 'Loyiha PM tasdig\'ini kutyapti', tekshiruv: () => 'Video PM va QA tekshiruvida', elon: () => 'E\'lon uchun ruxsat kutilmoqda' };

function holatOl(i) {
  const B = data.bosqichlar;
  const tayyorlar = B.filter((b) => i.bosqichlar[b.id]?.holat === 'tayyor').length;
  const nav = B.find((b) => b.id === i.navbatdagi);
  i.javobsiz = i.savollar.filter((s) => s.javob == null).length;
  if (!nav) return { cls: 'tayyor', matn: 'Hammasi tayyor', tayyorlar };
  const s = i.bosqichlar[nav.id];
  if (s?.holat === 'xato') return { cls: 'xato', matn: `Xato: ${nav.nomi}`, tayyorlar };
  if (s?.holat === 'kutilmoqda' || (nav.odam && KUTISH[nav.id])) return { cls: 'kut', matn: (KUTISH[nav.id] || (() => nav.nomi))(i), tayyorlar };
  return { cls: '', matn: `Navbatda: ${nav.nomi}`, tayyorlar };
}
const qadamCls = (i, b) => {
  const h = i.bosqichlar[b.id]?.holat;
  if (h === 'tayyor') return 't';
  if (h === 'xato') return 'x';
  if (b.id === i.navbatdagi) return h === 'kutilmoqda' || b.odam ? 'k' : 'j';
  return '';
};
const mahsulot = (m) => (m === 'kassa' ? 'Oson Kassa' : m === 'price' ? 'Oson Price' : '');
const sarlavha = (i) => i.sarlavha || i.nom;

function royxat() {
  tg?.BackButton.hide();
  const n = data.ishlar.length;
  if (!n) return (ilova.innerHTML = ekran('video', "Hali ish yo'q", "PM botga yangi update haqida yozsa, u shu yerda bosqichlari bilan chiqadi."));
  ilova.innerHTML = `<h1>Ishlar</h1><p class="sub">${n} ta update · yangilandi ${esc(data.vaqt?.slice(11) || '')}</p>` +
    data.ishlar.map((i, k) => {
      const h = holatOl(i);
      return `<button class="ish" data-k="${k}" aria-label="${esc(sarlavha(i))}: ${esc(h.matn)}">
        <div class="ish-bosh"><span class="ish-nom">${esc(sarlavha(i))}</span><span class="chip">${mahsulot(i.mahsulot)}${i.sinov ? ' · sinov' : ''}</span></div>
        <div class="holat ${h.cls}"><span class="nuqta"></span>${esc(h.matn)}</div>
        <div class="chiziq">${data.bosqichlar.map((b) => `<i class="${qadamCls(i, b)}"></i>`).join('')}</div>
        <div class="ish-oyoq"><span>${h.tayyorlar} / ${data.bosqichlar.length} bosqich</span><span>${esc(i.oxirgi || '')}</span></div>
      </button>`;
    }).join('');
  ilova.querySelectorAll('.ish').forEach((el) => (el.onclick = () => { tanlangan = data.ishlar[+el.dataset.k].nom; ochiqLoyiha = false; chiz(); scrollTo(0, 0); }));
}

function batafsil(i) {
  tg?.BackButton.show();
  const h = holatOl(i);
  const savollar = i.savollar.length ? `<h2>Savollar · ${i.savollar.length - i.javobsiz} / ${i.savollar.length} javob berilgan</h2><div class="blok">` +
    i.savollar.map((s) => `<div class="savol"><div class="savol-m">${esc(s.id)}. ${esc(s.savol)}</div>
      <div class="savol-j ${s.javob == null ? 'yoq' : ''}">${s.javob == null ? 'Javob kutilmoqda' : esc(s.javob)}</div></div>`).join('') + '</div>' : '';
  ilova.innerHTML = `${tg ? '' : '<button class="orqa" id="orqa">‹ Ishlar</button>'}
    <h1>${esc(sarlavha(i))}</h1><p class="sub">${mahsulot(i.mahsulot)}${i.sinov ? ' · sinov' : ''} · boshlangan ${esc(i.yaratildi || '')}</p>
    <div class="holat ${h.cls}" style="margin-top:0"><span class="nuqta"></span>${esc(h.matn)}</div>
    <h2>Bosqichlar · ${h.tayyorlar} / ${data.bosqichlar.length}</h2>
    <div class="blok">${data.bosqichlar.map((b, n) => {
      const c = qadamCls(i, b), s = i.bosqichlar[b.id];
      const izoh = s ? [s.vaqt, s.izoh].filter(Boolean).join(' · ') : (b.id === i.navbatdagi ? (b.odam ? 'Odamning javobi kerak' : 'Navbatda') : '');
      return `<div class="qadam ${c}"><span class="belgi">${c === 't' ? '✓' : n + 1}</span><div><div class="qadam-nom">${esc(b.nomi)}</div>${izoh ? `<div class="qadam-izoh">${esc(izoh)}</div>` : ''}</div></div>`;
    }).join('')}</div>
    ${savollar}
    ${i.loyiha ? `<h2>Ssenariy loyihasi</h2><details class="blok" id="loy" ${ochiqLoyiha ? 'open' : ''}><summary>Loyiha matni</summary><div class="loyiha">${esc(i.loyiha)}</div></details>` : ''}`;
  $('#orqa')?.addEventListener('click', orqaga);
  $('#loy')?.addEventListener('toggle', (e) => (ochiqLoyiha = e.target.open));
}

function orqaga() { tanlangan = null; chiz(); }
tg?.BackButton.onClick(orqaga);

function chiz() {
  const i = tanlangan && data.ishlar.find((x) => x.nom === tanlangan);
  if (i) batafsil(i); else { tanlangan = null; royxat(); }
}

async function yukla(birinchi) {
  if (!tg?.initData) return (ilova.innerHTML = ekran('qulf', "Telegram orqali oching", "Bu sahifa @osonupdater_robot ichidagi «Ishlar» tugmasi bilan ochiladi."));
  if (birinchi) ilova.innerHTML = ekran('aylan', 'Yuklanmoqda', 'Ishlar holati olinmoqda…', 'yuk');
  try {
    const r = await fetch(API, { headers: { 'X-Init-Data': tg.initData }, cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.xato || `Xato ${r.status}`), { kod: r.status });
    const yangi = JSON.stringify(j);
    if (yangi === JSON.stringify(data)) return;
    data = j;
    const y = scrollY; chiz(); if (!birinchi) scrollTo(0, y);
  } catch (e) {
    if (data && !birinchi) return; // fon yangilanishi — eski holat ekranda qoladi
    ilova.innerHTML = e.kod === 403 ? ekran('qulf', 'Ruxsat yo\'q', "Sizga hali ruxsat berilmagan. Abdullohdan so'rang.")
      : ekran('video', "Ulanib bo'lmadi", "Server javob bermadi. Birozdan keyin qayta oching.");
  }
}
const ilova = $('#ilova');
yukla(true);
setInterval(() => yukla(false), 10000);
</script>
</body>
</html>
